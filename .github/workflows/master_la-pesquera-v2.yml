# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - la-pesquera-v2

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@f02338908d150e00a4b8bebc2dad18bd9e5229b0 # v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: php-app
          # Publica únicamente los archivos que necesita la aplicación. No
          # incluyas respaldos, ZIPs, versiones antiguas ni archivos de CI.
          path: |
            index.php
            google29614857fe026a4e.html
            composer.json
            composer.lock
            api/**
            css/**
            imagenes/**
            includes/**
            js/**
            paginas/**
            php/**
            vendor/**

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_06B82429C59448038CD4AC09313FDC50 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D296CFC484CB4A008AC882A40752AAA2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_268CB869C0484A63B916AC24BAB05D43 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        id: deploy-to-webapp
        with:
          app-name: 'la-pesquera-v2'
          slot-name: 'Production'
          package: .
